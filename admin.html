<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#C9A9E8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="STC Admin">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Admin · Sweet Tooth Cravings</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap');
    :root {
      --lavender: #C9A9E8;
      --lavender-dark: #B48AE0;
      --cream: #FDF8F5;
      --ink: #3F2A2B;
      --muted: #6B5B5F;
      --border: #EDE4DC;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--cream);
      color: var(--ink);
      margin: 0;
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .heading-serif {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--lavender);
      box-shadow: 0 0 0 3px rgba(201, 169, 232, 0.28);
    }
    .btn-primary {
      background: var(--lavender);
      color: #fff;
      font-weight: 600;
      border: 0;
      border-radius: 1rem;
      min-height: 48px;
      transition: background 0.15s ease, transform 0.1s ease;
    }
    .btn-primary:active:not(:disabled) { transform: scale(0.98); background: var(--lavender-dark); }
    .btn-primary:disabled { opacity: 0.55; }
    .order-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1rem 1.1rem;
      box-shadow: 0 4px 14px rgba(63, 42, 43, 0.04);
    }
    .photo-row {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0.15rem 0;
      scrollbar-width: none;
    }
    .photo-row::-webkit-scrollbar { display: none; }
    .photo-thumb {
      flex: 0 0 auto;
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 0.85rem;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #F9F1EB;
      position: relative;
      padding: 0;
      cursor: pointer;
    }
    .photo-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-thumb .photo-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-align: center;
      color: #fff;
      background: linear-gradient(transparent, rgba(63,42,43,0.72));
      padding: 0.45rem 0.15rem 0.2rem;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(30, 20, 22, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: min(82dvh, 900px);
      border-radius: 1rem;
      object-fit: contain;
      background: #1a1213;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    .lightbox-close {
      position: absolute;
      top: max(0.75rem, env(safe-area-inset-top));
      right: 0.75rem;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 999px;
      border: 0;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 1.1rem;
    }
    .lightbox-caption {
      position: absolute;
      left: 1rem;
      right: 1rem;
      bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      text-align: center;
      color: rgba(255,255,255,0.9);
      font-size: 0.85rem;
      font-weight: 500;
    }
    .lightbox-open-tab {
      display: inline-block;
      margin-top: 0.35rem;
      color: #E8D4F8;
      font-size: 0.8rem;
      text-decoration: underline;
    }
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.45rem;
      margin-top: 0.75rem;
    }
    .quick-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      min-height: 3.1rem;
      padding: 0.45rem 0.25rem;
      border-radius: 0.9rem;
      border: 1px solid var(--border);
      background: #FDF8F5;
      color: var(--ink);
      font-size: 0.68rem;
      font-weight: 600;
      text-decoration: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .quick-btn i { font-size: 0.95rem; color: var(--lavender-dark); }
    .quick-btn:active { background: #F5EEFC; }
    .quick-btn:disabled,
    .quick-btn.is-disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .detail-block {
      margin-top: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.95rem;
      background: #FDF8F5;
      overflow: hidden;
    }
    .detail-block summary {
      list-style: none;
      cursor: pointer;
      padding: 0.7rem 0.85rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .detail-block summary::-webkit-details-marker { display: none; }
    .detail-block summary .chev {
      color: #8B6F6F;
      font-size: 0.7rem;
      transition: transform 0.15s ease;
    }
    .detail-block[open] summary .chev { transform: rotate(180deg); }
    .detail-body {
      padding: 0 0.85rem 0.85rem;
      border-top: 1px solid var(--border);
    }
    .detail-section-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      color: #8B6F6F;
      margin: 0.7rem 0 0.3rem;
    }
    .detail-section-title:first-child { margin-top: 0.65rem; }
    .cart-line {
      font-size: 0.8rem;
      line-height: 1.4;
      color: var(--ink);
      padding: 0.4rem 0.55rem;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      margin-bottom: 0.35rem;
    }
    .note-chip {
      font-size: 0.8rem;
      line-height: 1.4;
      padding: 0.45rem 0.6rem;
      border-radius: 0.65rem;
      background: #fff;
      border: 1px solid var(--border);
      margin-bottom: 0.35rem;
    }
    .note-chip strong {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8B6F6F;
      margin-bottom: 0.15rem;
    }
    .note-chip.allergy {
      border-color: #f0c4c4;
      background: #fff8f8;
    }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .stat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 0.7rem 0.45rem;
      text-align: center;
      box-shadow: 0 3px 10px rgba(63, 42, 43, 0.04);
    }
    .stat-card .stat-num {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.1;
      color: var(--ink);
    }
    .stat-card .stat-label {
      margin-top: 0.2rem;
      font-size: 0.62rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #8B6F6F;
      line-height: 1.25;
    }
    .stat-card.pending .stat-num { color: #7B4DB8; }
    .stat-card.invoice .stat-num { color: #1565C0; }
    .stat-card.paid .stat-num { color: #2E7D32; }
    .status-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
      margin-top: 0.55rem;
    }
    .btn-secondary {
      min-height: 42px;
      border-radius: 0.9rem;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }
    .btn-secondary:active:not(:disabled) { background: #F5EEFC; }
    .btn-secondary:disabled { opacity: 0.55; }
    .btn-secondary.paid-btn { border-color: #c8e6c9; color: #1B5E20; }
    .btn-secondary.done-btn { border-color: #d7cce8; color: #5E35B1; }
    .toast {
      position: fixed;
      left: 1rem;
      right: 1rem;
      bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
      z-index: 50;
      border-radius: 1rem;
      padding: 0.9rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 12px 30px rgba(0,0,0,0.12);
      transform: translateY(120%);
      transition: transform 0.25s ease;
    }
    .toast.show { transform: translateY(0); }
    .toast.ok { background: #1B5E20; color: #fff; }
    .toast.err { background: #B71C1C; color: #fff; }
    .skeleton {
      background: linear-gradient(90deg, #f3ebe4 25%, #faf5f1 50%, #f3ebe4 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
      border-radius: 0.75rem;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-[#EDE4DC] px-4 py-3 flex items-center justify-between" style="padding-top: max(0.75rem, env(safe-area-inset-top));">
    <a href="/" class="text-sm text-[#8B6F6F] hover:text-[#3F2A2B] flex items-center gap-1.5">
      <i class="fa-solid fa-chevron-left text-xs"></i> Shop
    </a>
    <div class="text-center">
      <div class="heading-serif text-base leading-tight">Sweet Tooth</div>
      <div class="text-[10px] uppercase tracking-widest text-[#8B6F6F]">Admin</div>
    </div>
    <button id="logout-btn" type="button" class="hidden text-sm text-[#8B6F6F] font-medium">Log out</button>
  </header>

  <!-- Login -->
  <section id="login-view" class="flex-1 flex items-center justify-center px-4 py-10">
    <form id="login-form" class="w-full max-w-sm bg-white border border-[#EDE4DC] rounded-3xl p-7 shadow-sm">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-[#F5EEFC] text-[#C9A9E8] flex items-center justify-center text-2xl mb-4">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h1 class="heading-serif text-2xl text-center">Admin login</h1>
      <p class="text-sm text-[#6B5B5F] text-center mt-2 leading-relaxed">
        Review pending orders and send 50% deposit invoices to customers.
      </p>
      <label class="block mt-6 text-xs font-semibold text-[#8B6F6F] uppercase tracking-wide" for="login-password">Password</label>
      <input
        type="password"
        id="login-password"
        class="form-input mt-1.5 w-full border border-[#EDE4DC] rounded-2xl px-4 h-12 text-base bg-[#FDF8F5]"
        placeholder="Enter admin password"
        autocomplete="current-password"
        required
        enterkeyhint="go"
      >
      <p id="login-error" class="hidden mt-2 text-sm text-red-600"></p>
      <button type="submit" class="btn-primary mt-4 w-full">Sign in</button>
    </form>
  </section>

  <!-- Dashboard -->
  <section id="dashboard-view" class="hidden flex-1 flex flex-col min-h-0">
    <div class="px-4 pt-4 pb-2">
      <div class="flex items-end justify-between gap-3">
        <div>
          <h2 class="heading-serif text-xl">Dashboard</h2>
          <p id="pending-count" class="text-sm text-[#6B5B5F] mt-0.5">Loading…</p>
        </div>
        <button id="refresh-btn" type="button" class="h-10 px-3.5 rounded-2xl border border-[#EDE4DC] bg-white text-sm font-medium text-[#3F2A2B] flex items-center gap-1.5">
          <i class="fa-solid fa-rotate-right text-xs text-[#C9A9E8]"></i>
          Refresh
        </button>
      </div>

      <div id="summary-stats" class="stat-grid" aria-label="Order summary">
        <div class="stat-card pending">
          <div class="stat-num" id="stat-pending">—</div>
          <div class="stat-label">Pending<br>Review</div>
        </div>
        <div class="stat-card invoice">
          <div class="stat-num" id="stat-invoice">—</div>
          <div class="stat-label">Invoice<br>Sent</div>
        </div>
        <div class="stat-card paid">
          <div class="stat-num" id="stat-paid">—</div>
          <div class="stat-label">Paid /<br>Completed</div>
        </div>
      </div>

      <h3 class="heading-serif text-lg mt-5">Pending Review</h3>
    </div>

    <div id="orders-list" class="flex-1 overflow-y-auto px-4 pb-8 space-y-3">
      <!-- cards injected here -->
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Full-size photo viewer -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Inspiration photo">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="lightbox-img" src="" alt="Inspiration photo">
    <div class="lightbox-caption">
      <div id="lightbox-label"></div>
      <a id="lightbox-open" class="lightbox-open-tab" href="#" target="_blank" rel="noopener">Open full size</a>
    </div>
  </div>

  <script>
    (function () {
      // Production API (same as shop). Localhost uses same-origin when available.
      var host = location.hostname;
      var isLive =
        host === 'sweettoothcravings.shop' ||
        host === 'www.sweettoothcravings.shop' ||
        host.endsWith('.github.io');
      var API_BASE = isLive
        ? 'https://sweettooth-cravings-api.onrender.com'
        : (window.STC_API_BASE || location.origin);
      // Hardcoded simple gate for mobile admin (also accepted by API)
      var ADMIN_PASSWORD = 'sweettooth2026';
      var TOKEN_KEY = 'stc_admin_token_v1';

      var loginView = document.getElementById('login-view');
      var dashView = document.getElementById('dashboard-view');
      var logoutBtn = document.getElementById('logout-btn');
      var ordersList = document.getElementById('orders-list');
      var pendingCount = document.getElementById('pending-count');
      var toastEl = document.getElementById('toast');
      var toastTimer = null;

      function getToken() {
        return sessionStorage.getItem(TOKEN_KEY) || '';
      }
      function setToken(t) {
        if (t) sessionStorage.setItem(TOKEN_KEY, t);
        else sessionStorage.removeItem(TOKEN_KEY);
      }

      function showToast(msg, ok) {
        toastEl.textContent = msg;
        toastEl.className = 'toast show ' + (ok ? 'ok' : 'err');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 4200);
      }

      function money(n) {
        var v = Number(n);
        if (!isFinite(v) || v < 0) return '—';
        return '$' + v.toFixed(2);
      }

      function escapeHtml(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      async function api(path, opts) {
        opts = opts || {};
        var headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
        var token = getToken();
        if (token) headers.Authorization = 'Bearer ' + token;
        var res = await fetch(API_BASE + path, Object.assign({}, opts, { headers: headers }));
        var data = {};
        try { data = await res.json(); } catch (e) { data = {}; }
        if (!res.ok) {
          var err = new Error(data.error || ('HTTP ' + res.status));
          err.status = res.status;
          err.data = data;
          throw err;
        }
        return data;
      }

      function setAuthed(authed) {
        loginView.classList.toggle('hidden', authed);
        dashView.classList.toggle('hidden', !authed);
        logoutBtn.classList.toggle('hidden', !authed);
      }

      function showLogin() {
        setToken('');
        setAuthed(false);
        document.getElementById('login-password').value = '';
      }

      document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var err = document.getElementById('login-error');
        err.classList.add('hidden');
        var password = document.getElementById('login-password').value.trim();

        // Local gate (works offline for UI) + server validation when possible
        if (password !== ADMIN_PASSWORD && password !== 'sweettooth-admin') {
          // Still try server in case env password differs
        }

        try {
          // Prefer live API login (returns token for Bearer calls)
          var data;
          try {
            data = await fetch(API_BASE + '/api/admin/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: password }),
            }).then(function (r) {
              return r.json().then(function (j) {
                if (!r.ok) throw new Error(j.error || 'Wrong password');
                return j;
              });
            });
          } catch (netErr) {
            // Fallback: accept hardcoded password if API is waking / offline
            if (password === ADMIN_PASSWORD || password === 'sweettooth-admin') {
              setToken(password);
              setAuthed(true);
              loadOrders();
              return;
            }
            throw netErr;
          }
          setToken(data.token || password);
          setAuthed(true);
          loadOrders();
        } catch (ex) {
          err.textContent = ex.message || 'Wrong password';
          err.classList.remove('hidden');
        }
      });

      logoutBtn.addEventListener('click', function () {
        showLogin();
      });

      document.getElementById('refresh-btn').addEventListener('click', function () {
        loadOrders();
      });

      function skeleton() {
        ordersList.innerHTML = [1, 2, 3].map(function () {
          return '<div class="order-card space-y-3">' +
            '<div class="skeleton h-4 w-1/3"></div>' +
            '<div class="skeleton h-3 w-2/3"></div>' +
            '<div class="skeleton h-3 w-1/2"></div>' +
            '<div class="skeleton h-12 w-full"></div>' +
            '</div>';
        }).join('');
      }

      function renderSummary(summary) {
        var s = summary || {};
        document.getElementById('stat-pending').textContent =
          s.pendingReview != null ? s.pendingReview : '—';
        document.getElementById('stat-invoice').textContent =
          s.invoiceSent != null ? s.invoiceSent : '—';
        document.getElementById('stat-paid').textContent =
          s.paidCompleted != null ? s.paidCompleted : '—';
      }

      async function loadOrders() {
        skeleton();
        pendingCount.textContent = 'Loading orders…';
        try {
          var data = await api('/api/admin/pending-orders');
          var orders = data.orders || [];
          renderSummary(data.summary);
          pendingCount.textContent = orders.length
            ? orders.length + ' pending · email invoices when ready'
            : 'No pending review orders';
          renderOrders(orders);
          if (data.sheetError) {
            console.warn('Sheet read warning:', data.sheetError);
          }
        } catch (e) {
          if (e.status === 401) {
            showLogin();
            showToast('Session expired — sign in again', false);
            return;
          }
          pendingCount.textContent = 'Could not load orders';
          renderSummary({});
          ordersList.innerHTML =
            '<div class="order-card text-center py-8">' +
            '<p class="text-[#6B5B5F] text-sm">' + escapeHtml(e.message || 'Load failed') + '</p>' +
            '<button type="button" id="retry-load" class="btn-primary mt-4 px-6">Try again</button>' +
            '</div>';
          var retry = document.getElementById('retry-load');
          if (retry) retry.onclick = loadOrders;
        }
      }

      function collectPhotos(o) {
        if (Array.isArray(o.photos) && o.photos.length) {
          return o.photos.filter(function (p) {
            return p && (p.thumb || p.url);
          });
        }
        // Fallback: raw photo1/2/3 or photoLinks
        var raw = [];
        if (o.photo1) raw.push(o.photo1);
        if (o.photo2) raw.push(o.photo2);
        if (o.photo3) raw.push(o.photo3);
        if (!raw.length && Array.isArray(o.photoLinks)) raw = o.photoLinks;
        return raw
          .map(function (url, i) {
            var s = String(url || '').trim();
            if (!s || !/^https?:\/\//i.test(s) && s.indexOf('data:image/') !== 0) return null;
            if (/upload failed/i.test(s)) return null;
            var fileId = '';
            var m = s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            if (m) fileId = m[1];
            return {
              url: fileId ? ('https://drive.google.com/file/d/' + fileId + '/view') : s,
              thumb: fileId ? ('https://drive.google.com/thumbnail?id=' + fileId + '&sz=w600') : s,
              label: 'Photo ' + (i + 1),
            };
          })
          .filter(Boolean);
      }

      function renderPhotoGallery(photos) {
        if (!photos || !photos.length) return '';
        var thumbs = photos.map(function (p, i) {
          var thumb = p.thumb || p.url;
          var openUrl = p.url || p.thumb;
          var label = p.label || ('Photo ' + (i + 1));
          return (
            '<button type="button" class="photo-thumb photo-open-btn"' +
              ' data-thumb="' + escapeHtml(thumb) + '"' +
              ' data-url="' + escapeHtml(openUrl) + '"' +
              ' data-label="' + escapeHtml(label) + '"' +
              ' aria-label="View ' + escapeHtml(label) + '">' +
              '<img src="' + escapeHtml(thumb) + '" alt="' + escapeHtml(label) + '" loading="lazy" decoding="async"' +
                ' onerror="this.parentElement.style.display=\'none\'">' +
              '<span class="photo-label">' + escapeHtml(label) + '</span>' +
            '</button>'
          );
        }).join('');
        return (
          '<div class="mt-3">' +
            '<div class="text-[10px] uppercase tracking-wider font-semibold text-[#8B6F6F] mb-1.5">Inspiration photos</div>' +
            '<div class="photo-row">' + thumbs + '</div>' +
          '</div>'
        );
      }

      function phoneDigits(phone) {
        var d = String(phone || '').replace(/\D/g, '');
        if (d.length === 10) d = '1' + d;
        return d;
      }

      function renderQuickActions(email, phone, name, orderNumber) {
        var digits = phoneDigits(phone);
        var hasPhone = digits.length >= 11;
        var telHref = hasPhone ? ('tel:+' + digits) : '#';
        var waText = encodeURIComponent(
          'Hi' + (name && name !== '—' ? ' ' + name : '') +
          '! This is Sweet Tooth Cravings regarding order ' + (orderNumber || '') + '.'
        );
        var waHref = hasPhone ? ('https://wa.me/' + digits + '?text=' + waText) : '#';
        return (
          '<div class="quick-actions">' +
            '<button type="button" class="quick-btn copy-email-btn" data-email="' + escapeHtml(email) + '"' +
              (email && email.indexOf('@') >= 0 ? '' : ' disabled') + '>' +
              '<i class="fa-regular fa-copy"></i><span>Copy Email</span>' +
            '</button>' +
            '<a class="quick-btn' + (hasPhone ? '' : ' is-disabled') + '" href="' + telHref + '"' +
              (hasPhone ? '' : ' aria-disabled="true" tabindex="-1"') + '>' +
              '<i class="fa-solid fa-phone"></i><span>Call</span>' +
            '</a>' +
            '<a class="quick-btn' + (hasPhone ? '' : ' is-disabled') + '" href="' + waHref + '"' +
              ' target="_blank" rel="noopener"' +
              (hasPhone ? '' : ' aria-disabled="true" tabindex="-1"') + '>' +
              '<i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span>' +
            '</a>' +
          '</div>'
        );
      }

      function renderOrderDetails(o) {
        var cartLines = Array.isArray(o.cartLines) && o.cartLines.length
          ? o.cartLines
          : String(o.cartText || o.lineItemsDetail || '')
              .split(/\n/)
              .map(function (l) { return l.trim(); })
              .filter(function (l) {
                return l && !/^—/.test(l) && !/^estimated subtotal/i.test(l) && !/^deposit due/i.test(l);
              });
        // If still one long blob, keep as single line
        if (!cartLines.length && o.lineItemsDetail) {
          cartLines = [String(o.lineItemsDetail).replace(/\s+/g, ' ').trim()];
        }

        var allergies = (o.allergies || '').trim();
        var notes = (o.notes || o.specialRequests || '').trim();
        var additional = (o.additionalNotes || '').trim();
        // Avoid duplicating notes if specialRequests === notes
        if (additional && additional === notes) additional = '';

        var hasBody = cartLines.length || allergies || notes || additional;
        if (!hasBody) return '';

        var cartHtml = cartLines.length
          ? '<div class="detail-section-title">Line items</div>' +
            cartLines.map(function (line) {
              return '<div class="cart-line">' + escapeHtml(line) + '</div>';
            }).join('')
          : '';

        var notesHtml = '';
        if (allergies) {
          notesHtml +=
            '<div class="note-chip allergy"><strong>Allergies</strong>' +
            escapeHtml(allergies) + '</div>';
        }
        if (notes) {
          notesHtml +=
            '<div class="note-chip"><strong>Notes / special requests</strong>' +
            escapeHtml(notes) + '</div>';
        }
        if (additional) {
          notesHtml +=
            '<div class="note-chip"><strong>Additional</strong>' +
            escapeHtml(additional) + '</div>';
        }
        if (notesHtml) {
          notesHtml = '<div class="detail-section-title">Notes</div>' + notesHtml;
        }

        return (
          '<details class="detail-block">' +
            '<summary>' +
              '<span><i class="fa-solid fa-list-ul text-[#C9A9E8] mr-1.5"></i>Order details</span>' +
              '<i class="fa-solid fa-chevron-down chev"></i>' +
            '</summary>' +
            '<div class="detail-body">' + cartHtml + notesHtml + '</div>' +
          '</details>'
        );
      }

      var lightbox = document.getElementById('lightbox');
      var lightboxImg = document.getElementById('lightbox-img');
      var lightboxLabel = document.getElementById('lightbox-label');
      var lightboxOpen = document.getElementById('lightbox-open');

      function openLightbox(thumb, url, label) {
        lightboxImg.src = thumb || url;
        lightboxImg.alt = label || 'Inspiration photo';
        lightboxLabel.textContent = label || 'Inspiration photo';
        lightboxOpen.href = url || thumb || '#';
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        lightbox.classList.remove('open');
        lightboxImg.removeAttribute('src');
        document.body.style.overflow = '';
      }
      document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeLightbox();
      });

      function renderOrders(orders) {
        if (!orders.length) {
          ordersList.innerHTML =
            '<div class="order-card text-center py-10">' +
            '<div class="text-3xl text-[#C9A9E8] mb-3"><i class="fa-solid fa-inbox"></i></div>' +
            '<p class="font-semibold">All caught up</p>' +
            '<p class="text-sm text-[#6B5B5F] mt-1">No orders with status Pending Review.</p>' +
            '</div>';
          return;
        }

        ordersList.innerHTML = orders.map(function (o, i) {
          var orderNumber = o.orderNumber || o.id || '—';
          var name = o.customerName || '—';
          var email = o.customerEmail || '';
          var phone = o.customerPhone || '';
          var eventDate = o.eventDate || '—';
          var deposit = o.depositAmount != null ? o.depositAmount : o.depositDue;
          if (deposit == null && o.estimatedSubtotal != null) {
            deposit = Math.round(Number(o.estimatedSubtotal) * 50) / 100;
          }
          var subtotal = o.estimatedSubtotal;
          var row = o.sheetRow != null ? o.sheetRow : '';
          var photos = collectPhotos(o);

          return (
            '<article class="order-card" data-idx="' + i + '">' +
              '<div class="flex items-start justify-between gap-2">' +
                '<div>' +
                  '<div class="text-[10px] uppercase tracking-wider font-semibold text-[#C9A9E8]">Order</div>' +
                  '<div class="font-semibold text-base leading-tight">' + escapeHtml(orderNumber) + '</div>' +
                '</div>' +
                '<span class="shrink-0 text-[10px] font-semibold px-2 py-1 rounded-full bg-[#F5EEFC] text-[#7B4DB8]">Pending Review</span>' +
              '</div>' +
              '<div class="mt-3 grid grid-cols-1 gap-1.5 text-sm">' +
                '<div class="flex gap-2"><span class="text-[#8B6F6F] w-24 shrink-0">Customer</span><span class="font-medium break-words">' + escapeHtml(name) + '</span></div>' +
                '<div class="flex gap-2"><span class="text-[#8B6F6F] w-24 shrink-0">Email</span><span class="font-medium break-all">' + escapeHtml(email) + '</span></div>' +
                (phone
                  ? '<div class="flex gap-2"><span class="text-[#8B6F6F] w-24 shrink-0">Phone</span><span class="font-medium">' + escapeHtml(phone) + '</span></div>'
                  : '') +
                '<div class="flex gap-2"><span class="text-[#8B6F6F] w-24 shrink-0">Event date</span><span class="font-medium">' + escapeHtml(eventDate) + '</span></div>' +
                '<div class="flex gap-2"><span class="text-[#8B6F6F] w-24 shrink-0">Deposit</span><span class="font-semibold text-[#3F2A2B]">' + money(deposit) +
                  (subtotal != null ? ' <span class="text-xs font-normal text-[#8B6F6F]">(50% of ' + money(subtotal) + ')</span>' : '') +
                '</span></div>' +
              '</div>' +
              renderQuickActions(email, phone, name, orderNumber) +
              renderOrderDetails(o) +
              renderPhotoGallery(photos) +
              '<button type="button" class="btn-primary send-invoice-btn mt-4 w-full flex items-center justify-center gap-2"' +
                ' data-order="' + escapeHtml(orderNumber) + '"' +
                ' data-email="' + escapeHtml(email) + '"' +
                ' data-deposit="' + (deposit != null ? deposit : '') + '"' +
                ' data-subtotal="' + (subtotal != null ? subtotal : '') + '"' +
                ' data-row="' + escapeHtml(String(row)) + '"' +
                ' data-name="' + escapeHtml(name) + '"' +
                ' data-event="' + escapeHtml(eventDate) + '"' +
                ' data-lines="' + escapeHtml(o.lineItemsDetail || '') + '">' +
                '<i class="fa-solid fa-paper-plane text-sm"></i>' +
                '<span>Send Invoice by Email</span>' +
              '</button>' +
              '<div class="status-actions">' +
                '<button type="button" class="btn-secondary paid-btn mark-status-btn"' +
                  ' data-order="' + escapeHtml(orderNumber) + '"' +
                  ' data-row="' + escapeHtml(String(row)) + '"' +
                  ' data-status="Paid">' +
                  '<i class="fa-solid fa-circle-check"></i><span>Mark as Paid</span>' +
                '</button>' +
                '<button type="button" class="btn-secondary done-btn mark-status-btn"' +
                  ' data-order="' + escapeHtml(orderNumber) + '"' +
                  ' data-row="' + escapeHtml(String(row)) + '"' +
                  ' data-status="Completed">' +
                  '<i class="fa-solid fa-flag-checkered"></i><span>Mark as Completed</span>' +
                '</button>' +
              '</div>' +
              '<p class="send-status mt-2 text-xs text-center text-[#6B5B5F] min-h-[1rem]"></p>' +
            '</article>'
          );
        }).join('');

        ordersList.querySelectorAll('.send-invoice-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            sendInvoice(btn);
          });
        });
        ordersList.querySelectorAll('.mark-status-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            markOrderStatus(btn);
          });
        });
        ordersList.querySelectorAll('.photo-open-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            openLightbox(
              btn.getAttribute('data-thumb') || '',
              btn.getAttribute('data-url') || '',
              btn.getAttribute('data-label') || 'Photo'
            );
          });
        });
        ordersList.querySelectorAll('.copy-email-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var em = btn.getAttribute('data-email') || '';
            if (!em) return;
            function done(ok) {
              showToast(ok ? 'Email copied: ' + em : 'Could not copy email', ok);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(em).then(function () { done(true); }).catch(function () {
                try {
                  var ta = document.createElement('textarea');
                  ta.value = em;
                  document.body.appendChild(ta);
                  ta.select();
                  document.execCommand('copy');
                  document.body.removeChild(ta);
                  done(true);
                } catch (e) { done(false); }
              });
            } else {
              try {
                var ta2 = document.createElement('textarea');
                ta2.value = em;
                document.body.appendChild(ta2);
                ta2.select();
                document.execCommand('copy');
                document.body.removeChild(ta2);
                done(true);
              } catch (e2) { done(false); }
            }
          });
        });
      }

      async function markOrderStatus(btn) {
        var orderNumber = btn.getAttribute('data-order') || '';
        var row = btn.getAttribute('data-row') || '';
        var status = btn.getAttribute('data-status') || '';
        var card = btn.closest('.order-card');
        var statusEl = card ? card.querySelector('.send-status') : null;
        var allStatusBtns = card
          ? card.querySelectorAll('.mark-status-btn, .send-invoice-btn')
          : [btn];

        if (!status) return;
        if (!orderNumber && !row) {
          showToast('Missing order id', false);
          return;
        }

        allStatusBtns.forEach(function (b) { b.disabled = true; });
        var original = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Saving…</span>';
        if (statusEl) statusEl.textContent = 'Updating status to ' + status + '…';

        try {
          var body = { orderNumber: orderNumber, status: status };
          if (row) body.row = row;
          var data = await api('/api/admin/update-order-status', {
            method: 'POST',
            body: JSON.stringify(body),
          });
          if (!data.success) throw new Error(data.error || 'Update failed');
          showToast(orderNumber + ' → ' + status, true);
          if (statusEl) {
            statusEl.innerHTML =
              '<span class="text-green-700 font-medium">✓ Status: ' +
              escapeHtml(status) +
              '</span>';
          }
          setTimeout(function () {
            loadOrders();
          }, 900);
        } catch (e) {
          showToast(e.message || 'Could not update status', false);
          if (statusEl) {
            statusEl.innerHTML =
              '<span class="text-red-600">' + escapeHtml(e.message || 'Failed') + '</span>';
          }
          allStatusBtns.forEach(function (b) { b.disabled = false; });
          btn.innerHTML = original;
        }
      }

      async function sendInvoice(btn) {
        var orderNumber = btn.getAttribute('data-order') || '';
        var email = btn.getAttribute('data-email') || '';
        var deposit = parseFloat(btn.getAttribute('data-deposit'));
        var subtotal = parseFloat(btn.getAttribute('data-subtotal'));
        var row = btn.getAttribute('data-row') || '';
        var name = btn.getAttribute('data-name') || '';
        var eventDate = btn.getAttribute('data-event') || '';
        var lines = btn.getAttribute('data-lines') || '';
        var statusEl = btn.parentElement.querySelector('.send-status');

        if (!email || email.indexOf('@') < 0) {
          showToast('This order has no valid customer email', false);
          if (statusEl) statusEl.textContent = 'Missing email';
          return;
        }
        if (!isFinite(deposit) || deposit < 0.5) {
          if (isFinite(subtotal) && subtotal >= 1) {
            deposit = Math.round(subtotal * 50) / 100;
          } else {
            showToast('Set deposit amount (need at least $0.50)', false);
            if (statusEl) statusEl.textContent = 'No deposit amount';
            return;
          }
        }

        var original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Sending email invoice…</span>';
        if (statusEl) statusEl.textContent = 'Emailing live Stripe invoice…';

        try {
          var body = {
            orderNumber: orderNumber,
            email: email,
            depositAmount: deposit,
            customerName: name,
            eventDate: eventDate === '—' ? '' : eventDate,
            lineItemsDetail: lines,
          };
          if (isFinite(subtotal) && subtotal > 0) body.estimatedSubtotal = subtotal;
          if (row) body.row = row;

          var data = await api('/api/send-deposit-invoice', {
            method: 'POST',
            body: JSON.stringify(body),
          });

          if (!data.success) throw new Error(data.error || 'Send failed');

          var msg = 'Invoice emailed to ' + email;
          if (data.depositDollars != null) {
            msg = 'Emailed $' + Number(data.depositDollars).toFixed(2) + ' deposit to ' + email;
          }
          if (data.sheetUpdate && data.sheetUpdate.ok === false) {
            msg += ' (sheet status may need manual update)';
          } else {
            msg += ' · Status → Invoice Sent';
          }
          showToast(msg, true);
          if (statusEl) {
            statusEl.innerHTML =
              '<span class="text-green-700 font-medium">✓ Emailed · Invoice Sent</span>' +
              (data.invoiceUrl
                ? ' · <a class="underline text-[#7B4DB8]" href="' +
                  escapeHtml(data.invoiceUrl) +
                  '" target="_blank" rel="noopener">View invoice</a>'
                : '');
          }
          btn.innerHTML = '<i class="fa-solid fa-check"></i><span>Invoice sent</span>';
          btn.classList.add('opacity-80');
          // Refresh list so the order leaves Pending Review after sheet status update
          setTimeout(function () {
            loadOrders();
          }, 1400);
        } catch (e) {
          showToast(e.message || 'Failed to send invoice', false);
          if (statusEl) statusEl.innerHTML = '<span class="text-red-600">' + escapeHtml(e.message || 'Failed') + '</span>';
          btn.disabled = false;
          btn.innerHTML = original;
        }
      }

      // Boot
      if (getToken()) {
        setAuthed(true);
        loadOrders();
      } else {
        setAuthed(false);
      }
    })();
  </script>
</body>
</html>
